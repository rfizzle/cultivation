import java.util.concurrent.TimeUnit

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.12'
}

version = computeModVersion()
group = project.maven_group

tasks.register('printVersion') {
    doLast { println project.version }
}

// Derives a SemVer-compliant version from `mod_version` plus the git state:
//   - exact tag match (e.g. HEAD == v0.0.0) → "0.0.0"
//   - exact tag, dirty tree                      → "0.0.0+dirty"
//   - N commits past the last matching tag       → "0.0.0+N.gSHA[.dirty]"
//   - no matching tag yet                        → "0.0.0+gSHA[.dirty]"
//   - git unavailable or describe fails          → "0.0.0"
// The base ("0.0.0") comes from gradle.properties and is bumped by hand; the tag that
// makes a release is cut by the `release` make target, which validates the version
// against SemVer before tagging. Tag pattern is `v*`.
def computeModVersion() {
    def base = project.mod_version
    def tagPrefix = "v"
    def described = runGitDescribe(tagPrefix)
    if (described == null || described.isEmpty()) {
        return base
    }
    if (described == "${tagPrefix}${base}") {
        return base
    }
    if (described == "${tagPrefix}${base}-dirty") {
        return "${base}+dirty"
    }
    def postTag = described =~ /^\Q${tagPrefix}\E(\S+?)-(\d+)-g([0-9a-f]+)(-dirty)?$/
    if (postTag.matches()) {
        def commits = postTag[0][2]
        def sha = postTag[0][3]
        def dirty = postTag[0][4] ? '.dirty' : ''
        return "${base}+${commits}.g${sha}${dirty}"
    }
    def shaOnly = described =~ /^([0-9a-f]+)(-dirty)?$/
    if (shaOnly.matches()) {
        def sha = shaOnly[0][1]
        def dirty = shaOnly[0][2] ? '.dirty' : ''
        return "${base}+g${sha}${dirty}"
    }
    return base
}

def runGitDescribe(String tagPrefix) {
    try {
        def proc = new ProcessBuilder('git', 'describe', '--tags',
                '--match', "${tagPrefix}*", '--dirty', '--always')
                .directory(rootDir)
                .redirectErrorStream(true)
                .start()
        // Bounded, never a bare waitFor(): this runs in the configuration phase, so a hung
        // git wedges every task in the build, not just the version computation. Git does
        // hang — a stale index.lock from a killed process, an unresponsive network
        // filesystem, a credential helper waiting on a prompt with no terminal.
        def finished = proc.waitFor(10, TimeUnit.SECONDS)
        if (!finished) {
            // destroyForcibly so the orphaned git process cannot outlive the daemon.
            proc.destroyForcibly()
            // Degrading to the mod_version base is right; doing it silently is not. On a
            // machine where git is merely slow, every invocation pays the full ten seconds
            // and then produces a jar versioned from the base with nothing in the log.
            logger.warn('git describe timed out after 10s — version falls back to the mod_version base')
            return null
        }
        def out = proc.inputStream.text.trim()
        if (proc.exitValue() != 0) return null
        return out
    } catch (Exception ignored) {
        return null
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Bai'
        url = 'https://maven2.bai.lol'
        content {
            includeGroup 'lol.bai'
            includeGroup 'mcp.mobius.waila'
        }
    }
}

loom {
    splitEnvironmentSourceSets()
}

sourceSets {
    main {
        resources {
            srcDirs += [ "src/main/generated" ]
        }
    }
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

// Deliberately NOT adding `sourceSets.client.output` to the test compile classpath. It reads as
// free reach for a client-facing Tier-1 guard, but nothing here can use it: the one client guard,
// SoilOverlayResourceContractTest, pins texture *paths*, and the class that owns them
// (SoilOverlayRenderTypes) builds RenderTypes against blaze3d in its static initializer. Binding
// it from a test compiles and then dies on class-load, because `test` has no client runtime — a
// failure the classpath entry invites rather than prevents. The guard reads the resources by path
// instead, which is what it should do, and stays honest about the client boundary.

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

// Minecraft's GameTestServer aborts ("No test functions were given!") when zero @GameTest
// functions are registered, so runGametest would fail CI until the first gametest lands.
// Skip the run while the gametest source set is empty; it runs normally once tests exist.
// This guard is declared above the `loom { runs { … } }` block that creates runGametest, so it
// matches the task lazily by name rather than resolving it eagerly.
tasks.matching { it.name == 'runGametest' }.configureEach {
    onlyIf {
        !sourceSets.gametest.allJava.files.isEmpty()
    }
}

loom {
    runs {
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=cultivation"
            runDir "build/datagen"
        }
        gametest {
            server()
            name "Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('junit-gametest.xml').get().asFile}"
            runDir "build/gametest"
        }
    }
}

// Attach the JaCoCo agent to the gametest server so code only exercised in-game counts toward
// coverage. Loom's run task is a JavaExec, so the task extension applies. The includes filter
// keeps the agent from instrumenting Minecraft/Fabric classes. Matched lazily by name (Loom
// registers runGametest during afterEvaluate) with the same idiom as the onlyIf guard above.
tasks.matching { it.name == 'runGametest' }.configureEach {
    jacoco.applyTo(it)
    it.jacoco.destinationFile = layout.buildDirectory.file('jacoco/runGametest.exec').get().asFile
    it.jacoco.includes = ['com.rfizzle.cultivation.*']
    // The agent's exec file is an @OutputFile, which would otherwise make this JavaExec
    // up-to-date-checkable and silently skip the whole in-world suite on a repeat run —
    // re-emitting the previous coverage number as if it were fresh. A gametest sweep must
    // always execute.
    it.outputs.upToDateWhen { false }
}

// Single source of coverage truth: unit tests + gametests merged over src/main. The
// unit-test-only jacocoTestReport reads 0% for everything a gametest drives (event handlers,
// commands, registration, mixin-driven behavior), so per-package coverage is read from this
// report, never from that one.
tasks.register('jacocoMergedReport', JacocoReport) {
    description = 'Merged unit + gametest coverage over src/main — the mod\'s real coverage number'
    group = 'verification'
    // The report reads compileJava/processResources output, so it must depend on them — without
    // this, any invocation that compiles without also scheduling a test task (e.g.
    // `gradlew jar jacocoMergedReport`) fails Gradle's implicit-dependency validation.
    dependsOn tasks.named('classes')
    // Ordering only — not dependsOn, so the report can run from existing exec data without
    // forcing a gametest server spin-up. Both sweeps write into build/jacoco, so without this
    // Gradle fails the implicit-dependency validation when the report shares an invocation
    // with test/runGametest.
    mustRunAfter test, tasks.named('runGametest')
    // fileTree only picks up exec files that exist, so the report still runs when one of the
    // two sweeps hasn't.
    executionData fileTree(layout.buildDirectory.dir('jacoco')) {
        include 'test.exec', 'runGametest.exec'
    }
    // Both ways a half-merged number can pass for a merged one, neither of which fails the
    // build. A sweep that never ran leaves its exec file absent. A sweep that was skipped or
    // simply not invoked leaves the previous run's file in place — Gradle deletes an exec file
    // only when the task that writes it actually executes, and nothing but `clean` empties
    // build/jacoco. Stale data does not throw either: JaCoCo keys execution data by class id,
    // so an edited class reads 0% from that half while its unedited neighbours merge coverage
    // from a sweep that never ran against this code.
    doFirst {
        def newestClass = sourceSets.main.output.classesDirs.asFileTree.files
                .collect { it.lastModified() }.max() ?: 0L
        ['test.exec', 'runGametest.exec'].each { name ->
            def execFile = layout.buildDirectory.file("jacoco/${name}").get().asFile
            if (!execFile.exists() || execFile.length() == 0) {
                logger.warn("jacocoMergedReport: ${name} is missing or empty — this report is NOT merged coverage")
            } else if (execFile.lastModified() < newestClass) {
                logger.warn("jacocoMergedReport: ${name} predates the compiled classes — rerun the sweep that writes it")
            }
        }
    }
    sourceSets sourceSets.main
    // Mixin bodies execute inside the transformed vanilla classes, so the agent can never
    // attribute coverage to the mixin class files — excluding them keeps the denominator
    // honest. Mixins stay thin (delegate to handlers), so nothing measurable hides here.
    // Derive from sourceSets.main lazily: the eager files(classDirectories.files.collect { … })
    // form resolves at configuration time and discards the task dependency on classes.
    classDirectories.setFrom(files(sourceSets.main.output).asFileTree.matching {
        exclude 'com/rfizzle/cultivation/mixin/**'
    })
    reports {
        xml.required = true
        html.required = true
    }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    // Fabric
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Client source set
    "clientImplementation"("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    // ModMenu 11.x — Config screen entry point for Fabric 1.21.1. Compile-only + dev runtime
    // so end users get the integration only when they install ModMenu themselves.
    modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"

    // Cloth Config 15.x — Config screen builder used by ModMenuIntegration. Compile-only for
    // the api surface; full mod in dev runtime.
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // Jade 15.x — Probe-tooltip integration (farmland fertility, crop growth modifiers). No api
    // split published; compile-only links the full mod but only the snownee.jade.api surface is
    // referenced.
    modCompileOnly "maven.modrinth:jade:${project.jade_version}"
    modLocalRuntime "maven.modrinth:jade:${project.jade_version}"

    // WTHIT 12.x — Alternative probe-tooltip integration (Jade fallback). Compile-only against
    // the API split. Discovered via waila_plugins.json at runtime.
    modCompileOnly "mcp.mobius.waila:wthit-api:${project.wthit_version}"

    // EMI 1.x — Recipe viewer (scythe recipes, Fertilizer source info).
    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"

    // REI 16.x — Recipe viewer (MC 1.21, runs on 1.21.1).
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    modLocalRuntime "dev.architectury:architectury-fabric:${project.architectury_version}"

    // JEI 19.x — Recipe viewer. The `fabric` runtime jar shades in all `common-api` classes,
    // so `transitive = false` prevents Loom remap from seeing the same classes twice and
    // emitting `duplicate input class` warnings.
    modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}"
    modLocalRuntime("mezz.jei:jei-1.21.1-fabric:${project.jei_version}") {
        transitive = false
    }

    // MixinExtras — @WrapOperation/@ModifyExpressionValue used by the soil mixins. Fabric
    // Loader 0.16.x already bundles mixinextras-fabric at runtime (jar-in-jar), so this is
    // compile-time only and never shipped; the annotationProcessor scope lets the Mixin AP
    // emit refmap entries for the wrapped targets so they remap in the production jar.
    compileOnly "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"

    // Tests
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Knot-based classloader that boots Fabric before tests run — registries,
    // item registrations, and onInitialize are available without Bootstrap.bootStrap().
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// With splitEnvironmentSourceSets, loom remaps fabric-api to *-common variants for the main
// runtime classpath but leaves the unmapped fabric-api sibling on testRuntimeClasspath.
// fabric-loader-junit then reads both the remapped (named) AW and the unmapped (intermediary)
// AW and aborts on namespace mismatch. Dropping the unmapped sibling keeps the remapped
// artifacts in place and lets the junit launcher boot.
configurations.testRuntimeClasspath {
    exclude group: 'net.fabricmc.fabric-api', module: 'fabric-api'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport

    // GametestRegistrationTest reads the gametest source tree and both manifests. The gametest
    // tree and its manifest are not on the test classpath at all, and the shipped manifest reaches
    // it only as a processResources output, so Gradle sees no dependency worth relying on.
    // Declaring them keeps the check from staying UP-TO-DATE exactly when registration has drifted.
    inputs.files(fileTree('src/gametest/java'),
                 file('src/gametest/resources/fabric.mod.json'),
                 file('src/main/resources/fabric.mod.json'))
            .withPropertyName('gametestRegistration')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('verifyDatagenIdempotent') {
    description = 'Runs datagen and asserts git reports no changes in src/main/generated/'
    group = 'verification'
    dependsOn 'runDatagen'
    notCompatibleWithConfigurationCache('shells out to git against live working-tree state')
    doLast {
        def genDir = file('src/main/generated').absolutePath
        def runGit = { List<String> argv ->
            try {
                def out = providers.exec {
                    commandLine argv
                    ignoreExitValue = true
                }
                out.result.get() // force resolution so a failure to start lands in the catch
                return out
            } catch (Exception e) {
                throw new GradleException(
                        'verifyDatagenIdempotent needs git on PATH to inspect ' +
                        'src/main/generated/, and could not run it: ' + e.message, e)
            }
        }
        def firstLines = { String text ->
            def lines = text.trim().readLines()
            lines.size() > 5 ? lines.take(5).join('\n') + "\n… (${lines.size()} lines total)"
                             : lines.join('\n')
        }

        // --no-optional-locks keeps a read-only check from taking .git/index.lock: git status
        // rewrites the index when cached stat info is stale, which is exactly the state
        // runDatagen leaves behind after rewriting every generated file.
        def statusResult = runGit(['git', '--no-optional-locks', 'status', '--porcelain', '--', genDir])
        def statusExit = statusResult.result.get().exitValue
        if (statusExit != 0) {
            throw new GradleException(
                    "git status failed with exit ${statusExit} while checking src/main/generated/:\n" +
                    firstLines(statusResult.standardError.asText.get()))
        }
        def dirty = statusResult.standardOutput.asText.get().trim()
        if (!dirty.isEmpty()) {
            throw new GradleException(
                    'src/main/generated/ changed after runDatagen:\n' + firstLines(dirty) +
                    '\nRun ./gradlew runDatagen, then git add and commit the results.')
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    exclude "**/.gitkeep"
    exclude "**/.cache"
}

processClientResources {
    exclude "**/.gitkeep"
    exclude "**/.cache"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version.toInteger()
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    exclude "**/.gitkeep"
    exclude "**/.cache"
}

tasks.named('sourcesJar') {
    exclude "**/.gitkeep"
    exclude "**/.cache"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
